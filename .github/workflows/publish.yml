name: Publish

# `npm version <sdk version> && git push --follow-tags` pushes the tag that runs this.
# The SDK is committed in sdk/, so the build needs nothing from the app repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing, so no token is stored in the repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly typechecks, tests and builds.
      - run: npm publish
